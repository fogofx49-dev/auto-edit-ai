
name: Build AUTO EDIT AI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnosticar Manifest
        run: |
          echo "===== CONTEUDO DO MANIFEST ====="
          cat -A app/src/main/AndroidManifest.xml

          echo "===== VALIDAR XML ====="
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml'); print('XML VALIDO')"

          echo "===== COMPILAR ====="
          gradle --no-daemon assembleDebug --stacktrace

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTO-EDIT-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
